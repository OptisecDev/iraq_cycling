<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#123A66"/>
      <stop offset="100%" stop-color="#1C6FB0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background, no pre-rounded corners (platform applies its own mask) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg3)"/>

  <!-- outer decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#D4AF37" stroke-width="10"/>

  <!-- wheel ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#F2D680" stroke-width="20"/>

  <!-- spokes forming stylized "A" -->
  <path d="M256 146 L166 366 M256 146 L346 366 M216 270 L296 270"
        fill="none" stroke="#FBF6EE" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hub accent -->
  <circle cx="256" cy="146" r="9" fill="#D4AF37"/>

  <!-- ziggurat silhouette at the base -->
  <rect x="196" y="366" width="120" height="18" fill="#B8860B"/>
  <rect x="212" y="348" width="88" height="18" fill="#B8860B"/>
  <rect x="228" y="330" width="56" height="18" fill="#B8860B"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2A43"/>
      <stop offset="100%" stop-color="#0F5C56"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg2)"/>

  <!-- bike frame stylized as "A" -->
  <path d="M256 140 L176 392 M256 140 L336 392 M216 258 L296 258"
        fill="none" stroke="#22B07D" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wheel hubs at the feet of the frame -->
  <circle cx="176" cy="392" r="34" fill="none" stroke="#E8B94B" stroke-width="12"/>
  <circle cx="336" cy="392" r="34" fill="none" stroke="#E8B94B" stroke-width="12"/>

  <!-- headset accent -->
  <circle cx="256" cy="140" r="9" fill="#E8B94B"/>

  <!-- palm-frond crown above the apex -->
  <path d="M256 140 Q256 106 256 88" fill="none" stroke="#E8B94B" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 140 Q225 114 205 96" fill="none" stroke="#E8B94B" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 140 Q238 130 224 120" fill="none" stroke="#E8B94B" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 140 Q287 114 307 96" fill="none" stroke="#E8B94B" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 140 Q274 130 288 120" fill="none" stroke="#E8B94B" stroke-width="7" stroke-linecap="round"/>
</svg>

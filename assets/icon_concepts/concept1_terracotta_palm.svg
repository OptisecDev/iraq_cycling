<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C1442D"/>
      <stop offset="100%" stop-color="#7A1F12"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg1)"/>

  <!-- bike wheel rim -->
  <circle cx="256" cy="268" r="156" fill="none" stroke="#FBF6EE" stroke-width="22"/>

  <!-- spokes forming stylized "A" -->
  <path d="M256 132 L156 404 M256 132 L356 404 M198 300 L314 300"
        fill="none" stroke="#FBF6EE" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hub accent -->
  <circle cx="256" cy="132" r="11" fill="#F0B429"/>

  <!-- palm tree nested at the base of the wheel -->
  <path d="M256 404 Q250 378 256 352" fill="none" stroke="#F0B429" stroke-width="11" stroke-linecap="round"/>
  <path d="M256 352 Q210 335 190 368" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 352 Q226 320 216 355" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 352 Q256 328 256 316" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 352 Q286 320 296 355" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 352 Q302 335 322 368" fill="none" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
</svg>
